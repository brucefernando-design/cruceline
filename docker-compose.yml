name: cruceline

services:
  web:
    build: .
    container_name: cruceline
    restart: unless-stopped
    env_file: .env
    environment:
      CRUCELINE_DB: /data/cruceline.db
      PORT: "5055"
    volumes:
      - cruceline_data:/data
      - cruceline_backups:/backups
    ports:
      - "127.0.0.1:5055:5055"
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5055/')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cruceline_data:
  cruceline_backups:
